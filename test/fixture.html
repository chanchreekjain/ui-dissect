<!doctype html><html><head><meta charset="utf-8"><title>UI Dissect harness</title>
<style>
  body { margin:0; background:#0b1020; font-family: system-ui, sans-serif; padding:60px; }
  .glass { width:320px; padding:24px; border-radius:18px;
    background: rgba(255,255,255,0.08); backdrop-filter: blur(14px);
    border:1px solid rgba(255,255,255,0.2);
    box-shadow: 0 20px 50px rgba(0,0,0,0.6); color:#c7d2fe; font-size:15px; }
  .lowcontrast { margin-top:40px; width:320px; padding:20px; border-radius:8px;
    background:#ffffff; color:#bbbbbb; font-size:14px; }
  .grad { margin-top:40px; width:320px; padding:20px; border-radius:12px;
    background:linear-gradient(120deg,#6366f1,#ec4899); color:#fff; font-size:16px; }
</style></head><body>
<div class="glass" id="glass">Glass card with some text inside it</div>
<div class="lowcontrast" id="low">Low contrast grey on white</div>
<div class="grad" id="grad">Gradient panel</div>
</body></html>
