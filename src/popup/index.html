<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UI Dissect</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.1);
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      width: 320px;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .badge.active {
      background: rgba(99, 102, 241, 0.15);
      border-color: var(--accent);
      color: #a5b4fc;
    }
    .badge.frozen {
      background: rgba(56, 189, 248, 0.15);
      border-color: #38bdf8;
      color: #7dd3fc;
    }
    .btn-toggle {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--accent);
      background: linear-gradient(180deg, #6366f1 0%, #4f46e5 100%);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 0 15px var(--accent-glow);
      transition: all 0.15s ease;
    }
    .btn-toggle:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }
    .shortcuts-card {
      margin-top: 14px;
      padding: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 11px;
    }
    .shortcut-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
      color: var(--text-muted);
    }
    kbd {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      padding: 2px 5px;
      font-family: monospace;
      color: var(--text);
      font-size: 10px;
    }
    .pref-group {
      margin-top: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
    }
    select {
      background: #151b28;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 11px;
      outline: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <span>UI Dissect</span>
      <span id="statusBadge" class="badge">Standby</span>
    </div>
  </div>

  <button id="toggleBtn" class="btn-toggle">
    <span>Launch Inspector</span>
  </button>

  <div class="shortcuts-card">
    <div class="shortcut-row">
      <span>Toggle Inspector</span>
      <kbd>Ctrl+Shift+X</kbd>
    </div>
    <div class="shortcut-row">
      <span>Freeze / Unfreeze</span>
      <kbd>Space</kbd>
    </div>
    <div class="shortcut-row">
      <span>Parent / Child Layer</span>
      <kbd>↑ / ↓</kbd>
    </div>
    <div class="shortcut-row">
      <span>Copy & Exit</span>
      <kbd>C / Enter</kbd>
    </div>
  </div>

  <div class="pref-group">
    <span>Default Output Format</span>
    <select id="defaultFormat">
      <option value="tailwind">Tailwind CSS</option>
      <option value="css">Scoped CSS</option>
      <option value="react">React / JSX</option>
      <option value="tokens">Design Tokens</option>
    </select>
  </div>

  <script type="module" src="index.js"></script>
</body>
</html>
